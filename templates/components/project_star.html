<form
  method="post"
  action="{% url 'main:toggle_star' project.pk %}"
  class="star-form"
  data-star-form

>
  {% csrf_token %}
  <input type="hidden" name="return_to" value="{{ star_return_to|default:'projects' }}" />
  <button
    type="submit"
    class="star-button{% if user in project.starred_by.all %} is-starred{% endif %}"

    title="{{ project.starred_by.count }} stars"
  >
    <span class="star-icon"
      >{% if user in project.starred_by.all %}★{% else %}☆{% endif %}</span
    >
    <span class="star-count">{{ project.starred_by.count }}</span>
  </button>
</form>
