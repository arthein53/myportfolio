<details class="delete-confirmation">
    <summary class="button button-danger">Delete</summary>
    <form method="post" action="{% url 'main:delete_project' project.pk %}">
        {% csrf_token %}
        <label>Password <input name="password" type="password" required></label>
        <div class="delete-confirmation-actions">
            <button class="button button-secondary" type="button" onclick="this.closest('details').removeAttribute('open')">Cancel</button>
            <button class="button button-danger" type="submit">Delete</button>
        </div>
    </form>
</details>
